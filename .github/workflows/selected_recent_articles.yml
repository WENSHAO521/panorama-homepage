name: Daily Publisher Data Refresh

on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:

jobs:
  update-publisher-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build daily article selection
        shell: pwsh
        run: ./scripts/fetch-selected-recent-articles.ps1 -PoolLimit 100 -Limit 20

      - name: Refresh journal descriptions
        shell: pwsh
        run: ./scripts/fetch-journal-descriptions.ps1

      - name: Commit and push updated site data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/articles.json data/journals.json
          git commit -m "chore(data): auto-update publisher site data [skip ci]" || exit 0
          git push origin main
