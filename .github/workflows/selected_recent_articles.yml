name: Daily Publisher Data Refresh

on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:

jobs:
  update-publisher-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Refresh recent articles from Crossref
        env:
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
        run: python scripts/fetch_recent_articles.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Refresh journal announcements
        run: node scripts/fetch_announcements.mjs

      - name: Refresh journal descriptions
        shell: pwsh
        run: |
          try {
            ./scripts/fetch-journal-descriptions.ps1 -BatchSize 10 -BatchDelaySeconds 15 -RequestDelaySeconds 2
          } catch {
            Write-Warning "Journal description refresh failed: $($_.Exception.Message)"
            if (Test-Path data/journals.json) {
              Write-Warning "Keeping existing data/journals.json cache."
              exit 0
            }
            throw
          }

      - name: Commit and push updated site data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/articles.json data/journals.json data/announcements.json
          git commit -m "chore(data): auto-update publisher site data [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Push failed after 5 attempts"
              exit 1
            fi
            echo "Push rejected, retrying attempt $((attempt + 1))..."
            sleep 5
          done
