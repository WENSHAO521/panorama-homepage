name: Daily Publisher Data Refresh

on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:

jobs:
  update-publisher-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build daily article selection
        shell: pwsh
        run: |
          try {
            ./scripts/fetch-selected-recent-articles.ps1 -PoolLimit 50 -Limit 20 -RequestDelaySeconds 8
          } catch {
            Write-Warning "Article refresh failed: $($_.Exception.Message)"
            if (Test-Path data/articles.json) {
              Write-Warning "Keeping existing data/articles.json cache."
              exit 0
            }
            throw
          }

      - name: Refresh journal descriptions
        shell: pwsh
        run: |
          try {
            ./scripts/fetch-journal-descriptions.ps1 -BatchSize 10 -BatchDelaySeconds 15 -RequestDelaySeconds 2
          } catch {
            Write-Warning "Journal description refresh failed: $($_.Exception.Message)"
            if (Test-Path data/journals.json) {
              Write-Warning "Keeping existing data/journals.json cache."
              exit 0
            }
            throw
          }

      - name: Commit and push updated site data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/articles.json data/journals.json
          git commit -m "chore(data): auto-update publisher site data [skip ci]" || exit 0
          git push origin main
