name: Weekly scholarly site data refresh

on:
  schedule:
    - cron: '10 2 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-scholarly-site-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install site dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Refresh announcements
        working-directory: web
        run: npm run fetch:announcements

      - name: Refresh article catalogue
        working-directory: web
        run: npm run fetch:articles

      - name: Commit refreshed data
        shell: bash
        run: |
          git add web/src/data/announcements.json web/src/data/articles.json
          if git diff --cached --quiet; then
            echo "No site data changes to commit."
            exit 0
          fi
          git config user.name "Panorama Site Data Bot"
          git config user.email "action@github.com"
          git commit -m "chore(data): refresh scholarly site feeds"
          git push
