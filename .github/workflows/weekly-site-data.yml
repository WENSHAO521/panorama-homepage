name: Weekly scholarly site data refresh

on:
  schedule:
    - cron: '10 2 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-scholarly-site-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Lets the harvest past the Cloudflare challenge on panorama-sg.com hosts
      # (see docs/SITE-DATA-FEEDS.md). Sent only to those hosts.
      SITE_DATA_BOT_TOKEN: ${{ secrets.SITE_DATA_BOT_TOKEN }}
      # Each script appends the sources it could not read to this file.
      SITE_DATA_REPORT: ${{ github.workspace }}/site-data-report.jsonl
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install site dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Refresh announcements
        working-directory: web
        run: npm run fetch:announcements

      - name: Refresh article catalogue
        working-directory: web
        run: npm run fetch:articles

      - name: Commit refreshed data
        shell: bash
        run: |
          git add web/src/data/announcements.json web/src/data/articles.json
          if git diff --cached --quiet; then
            echo "No site data changes to commit."
            exit 0
          fi
          git config user.name "Panorama Site Data Bot"
          git config user.email "action@github.com"
          git commit -m "chore(data): refresh scholarly site feeds"
          git push

      # Runs after the commit so whatever was harvested is still published,
      # then turns the run red if any source was blocked or failed.
      - name: Report blocked or failed sources
        if: always()
        shell: bash
        run: |
          {
            echo "## Site data harvest"
            if [ -z "$SITE_DATA_BOT_TOKEN" ]; then
              echo "- ⚠️ SITE_DATA_BOT_TOKEN secret is not set; requests carry no bot pass header."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$SITE_DATA_REPORT" ]; then
            echo "- All sources harvested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const rows = fs.readFileSync(process.env.SITE_DATA_REPORT, "utf8").trim().split("\n").map(JSON.parse);
            const lines = rows.map((r) => "- **" + r.severity + "** " + r.script + " / " + r.source + ": " + r.message);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            for (const r of rows) {
              const kind = r.severity === "error" ? "error" : "warning";
              console.log("::" + kind + " title=" + r.script + " " + r.source + "::" + r.message.replace(/[\r\n]+/g, " "));
            }
            const errors = rows.filter((r) => r.severity === "error").length;
            if (errors) {
              console.log(errors + " source(s) could not be harvested; the site keeps their previous data.");
              process.exit(1);
            }
          '
